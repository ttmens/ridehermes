name: ride_hermes_passenger
description: RideHermes Passenger App - ride-hailing with voice AI
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Router
  go_router: ^14.2.0

  # Network
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # Location & Maps
  amap_flutter_map: ^3.0.0
  amap_flutter_location: ^3.0.0
  amap_flutter_base: ^3.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

  # Audio
  record: ^6.0.0

  # Speech to Text
  speech_to_text: ^6.6.0

  # UI
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.0

  # Permissions
  permission_handler: ^11.2.0

  # Toast
  fluttertoast: ^8.2.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.3.0

  # Code generation
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  freezed: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
