<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地图测试</title>
  <script type="text/javascript">
    window._AMapSecurityConfig = {
      securityJsCode: '',
    };
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=473c3c82dc0cd2f3ecf99eb3d0babeaa"></script>
  <style>
    * { margin: 0; padding: 0; }
    #map { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    console.log('检查 AMap:', typeof AMap);
    if (typeof AMap !== 'undefined' && AMap.Map) {
      console.log('开始创建地图...');
      var map = new AMap.Map('map', {
        zoom: 12,
        center: [116.397428, 39.90923],
        viewMode: '2D'
      });
      map.on('complete', function() {
        console.log('地图加载完成！');
        alert('地图加载成功！');
      });
    } else {
      alert('AMap SDK 未加载！');
    }
  </script>
</body>
</html>
